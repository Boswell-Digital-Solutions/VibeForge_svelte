[package]
name = "vibeforge"
version = "0.1.0"
description = "Intelligent project creation wizard with runtime detection"
authors = ["VibeForge Team"]
license = "MIT"
repository = ""
edition = "2024"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
which = "5.0"
regex = "1.10"
chrono = { version = "0.4", features = ["serde"] }
# Loopback-only HTTP for the local inference bridge. Blocking and small; the
# bridge makes two GETs and needs no async runtime of its own.
ureq = "2.10"
thiserror = "1.0"
anyhow = "1.0"
walkdir = "2.4"
handlebars = "5.1"
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "migrate", "macros"] }
ulid = "1"
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
