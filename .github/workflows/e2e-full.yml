# Full browser regression.
#
# Every spec, on all three browsers, with complete reports. This lane is not
# part of ordinary pull-request CI: that runs the bounded `@smoke` subset in
# ci.yml. This one runs by dispatch, or when a release-qualification workflow
# calls it.
#
# The daily schedule is removed, under the rule that there are no scheduled
# full runs.
#
# This lane is expected to fail today. Most specs need a local service stack
# that CI does not run, so they time out. The reports are the point: they say
# which specs still depend on a service. See docs/KNOWN_ISSUES.md. It is
# therefore not yet wired as a blocking job in release-gate.yml, because it
# could not pass.
#
# Four shards per browser, and a 60-minute cap, so a run finishes and the
# reports are complete. This workflow was previously two shards at 45 minutes,
# which a measured shard time of about 14 minutes plus CI's two retries would
# have overrun. The 30-minute cap that reported nothing was ci.yml's, on the
# lane this one replaces.

name: E2E Full Browser Regression

on:
  workflow_dispatch:
  workflow_call:

jobs:
  e2e-full:
    name: Full Browser Regression
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        shard: [1/4, 2/4, 3/4, 4/4]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        # The setup project (tests/e2e/auth.setup.ts) declares no browser, so it
        # runs in chromium, and every browser project depends on it. Install
        # chromium alongside the matrix browser or the setup cannot launch.
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }} chromium

      - name: Run E2E tests (sharded)
        # `--reporter=blob` is required. Playwright does not switch to the blob
        # reporter on its own when sharding, and the config sets `html`, so
        # without this no blob-report/ is produced, the upload below captures
        # nothing, and the merge job fails with "No report files found".
        run: pnpm exec playwright test --project=${{ matrix.browser }} --shard=${{ matrix.shard }} --reporter=blob
        env:
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-full-${{ matrix.browser }}-${{ matrix.shard }}-${{ github.run_number }}
          path: playwright-report/
          retention-days: 14

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-full-${{ matrix.browser }}-${{ matrix.shard }}-${{ github.run_number }}
          path: test-results/
          retention-days: 14

      - name: Upload blob report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blob-report-${{ matrix.browser }}-${{ matrix.shard }}
          path: blob-report/
          retention-days: 7

  merge-reports:
    name: Merge Test Reports
    if: always()
    needs: [e2e-full]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download blob reports
        uses: actions/download-artifact@v4
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge reports
        run: pnpm exec playwright merge-reports --reporter html ./all-blob-reports

      - name: Upload merged HTML report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-full-merged-${{ github.run_number }}
          path: playwright-report/
          retention-days: 30
