# Release gate: real authentication must pass before a release.
#
# Ordinary pull-request CI is hermetic. It answers the login request in the
# browser with a synthetic session, so it proves nothing about NeuroForge
# authentication. This workflow is where that claim is made and enforced.
#
# The job is blocking. It fails when the endpoint or the credentials are
# missing, because `E2E_REAL_AUTH_REQUIRED` is true. A release therefore
# cannot pass this gate on an unconfigured runner. That is deliberate, not a
# broken workflow.
#
# The secrets below must name an ISOLATED TEST ACCOUNT on a test NeuroForge
# deployment. Do not supply production credentials. The spec only performs a
# login and reads local storage; it writes nothing.
#
# `E2E_REAL_AUTH_ACCOUNT_CLASS` must be set to `isolated-test` in the secret
# store, or the gate fails closed. Treat that as the operator's attestation
# about the account, not as verification of it. No check here can inspect the
# credential and determine whether the account is really isolated.
#
# Authorized by the operator ruling on PR #13, conditions 4 and 5.
#
# WHAT THIS GATE DOES NOT DO YET
#
# This repository has no publish or deploy workflow. Nothing is gated today.
# A tag-triggered run happens alongside a release; it does not prevent one.
#
# `workflow_call` exists so that a future publish workflow enforces this gate
# by construction rather than by convention. A publish job must either call
# this workflow and depend on it:
#
#     jobs:
#       gate:
#         uses: ./.github/workflows/release-gate.yml
#         secrets: inherit
#       publish:
#         needs: [gate]
#
# or sit behind a protected environment that requires this check. A publish job
# that merely runs after this one, with no `needs`, is not gated.
#
# Full browser regression (`e2e-full.yml`) also accepts `workflow_call`, and
# belongs here as a second blocking job once the service-dependent specs are
# classified into their own lane. It is not added yet, because it cannot pass
# today and a gate that can never pass gates nothing. Run it by dispatch at
# release qualification and read its reports.
#
# See docs/KNOWN_ISSUES.md.

name: Release Gate

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
  workflow_call:

jobs:
  real-auth-gate:
    name: Real authentication gate (blocking)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run the real-authentication gate
        run: pnpm test:e2e:real-auth
        env:
          CI: true
          # Turns a missing or inconsistent setting into a failure. Without
          # this the spec would skip, and a release would pass unverified.
          E2E_REAL_AUTH_REQUIRED: 'true'
          # Taken from the secret store, alongside the credentials it
          # describes, rather than written here. A literal in this file would
          # be the workflow attesting about itself: the check would always
          # pass and would never inspect the credential. It is still an
          # operator attestation, not verification -- nothing here can tell
          # whether the account behind the secrets is really isolated.
          E2E_REAL_AUTH_ACCOUNT_CLASS: ${{ secrets.E2E_REAL_AUTH_ACCOUNT_CLASS }}
          E2E_REAL_AUTH_URL: ${{ secrets.E2E_REAL_AUTH_URL }}
          E2E_REAL_AUTH_USERNAME: ${{ secrets.E2E_REAL_AUTH_USERNAME }}
          E2E_REAL_AUTH_PASSWORD: ${{ secrets.E2E_REAL_AUTH_PASSWORD }}
          # The application reads VITE_NEUROFORGE_URL. It must match
          # E2E_REAL_AUTH_URL, or the page talks to the default endpoint while
          # the gate reports that it tested the configured one. The spec
          # compares the two and fails on a mismatch.
          VITE_NEUROFORGE_URL: ${{ secrets.E2E_REAL_AUTH_URL }}

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-gate-real-auth-report
          path: playwright-report/
          retention-days: 30
